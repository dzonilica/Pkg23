<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pkg23 - samo poslednjih 23</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #FF6B35;
      --secondary: #F7931E;
      --dark: #1A1A2E;
      --darker: #0F0F1E;
      --light: #EAEAEA;
      --accent: #00D9FF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--darker);
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.1;
      background: 
        radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, var(--accent) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, var(--secondary) 0%, transparent 50%);
      animation: bgPulse 15s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.15; transform: scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: rgba(26, 26, 46, 0.9);
      border: 2px solid var(--primary);
      padding: 3rem;
      border-radius: 0;
      max-width: 450px;
      width: 100%;
      position: relative;
      box-shadow: 
        0 0 0 4px var(--darker),
        0 0 0 6px var(--primary),
        0 20px 60px rgba(255, 107, 53, 0.3);
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: -10px;
      right: -10px;
      width: 20px;
      height: 20px;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      line-height: 1;
      letter-spacing: -4px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(255, 107, 53, 0.5);
    }

    .tagline {
      text-align: center;
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 2.5rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input {
      width: 100%;
      padding: 1rem;
      background: var(--darker);
      border: 2px solid var(--dark);
      color: var(--light);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border: none;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 3rem;
    }

    .header .logo {
      font-size: 3rem;
      margin: 0;
      text-align: left;
    }

    .user-info {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .user-email {
      color: var(--accent);
      font-size: 0.85rem;
    }

    .btn-logout {
      padding: 0.7rem 1.5rem;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-logout:hover {
      background: var(--accent);
      color: var(--darker);
    }

    .camera-section {
      margin-bottom: 3rem;
    }

    .btn-camera {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 2.5rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border: none;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .btn-camera:hover {
      transform: translateX(5px);
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
    }

    .camera-view {
      background: rgba(26, 26, 46, 0.95);
      border: 2px solid var(--accent);
      padding: 2rem;
      margin-top: 2rem;
      position: relative;
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .video-preview {
      width: 100%;
      max-width: 640px;
      height: auto;
      display: block;
      margin: 0 auto 1.5rem;
      border: 3px solid var(--primary);
    }

    .camera-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn-cancel, .btn-capture {
      padding: 1rem 2rem;
      border: 2px solid;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-cancel {
      background: transparent;
      border-color: var(--light);
      color: var(--light);
    }

    .btn-cancel:hover {
      background: var(--light);
      color: var(--darker);
    }

    .btn-capture {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--darker);
    }

    .btn-capture:hover {
      background: transparent;
      color: var(--accent);
    }

    .gallery {
      background: rgba(26, 26, 46, 0.6);
      border: 2px solid var(--primary);
      padding: 2rem;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--dark);
    }

    .gallery-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .photo-count {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      padding: 0.5rem 1.5rem;
      background: rgba(0, 217, 255, 0.1);
      border: 2px solid var(--accent);
    }

    .photos-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border: 3px solid var(--dark);
      transition: all 0.3s ease;
      animation: fadeInLeft 0.5s ease-out;
      animation-fill-mode: both;
    }

    .photo-card:nth-child(1) { animation-delay: 0.05s; }
    .photo-card:nth-child(2) { animation-delay: 0.1s; }
    .photo-card:nth-child(3) { animation-delay: 0.15s; }
    .photo-card:nth-child(4) { animation-delay: 0.2s; }
    .photo-card:nth-child(5) { animation-delay: 0.25s; }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .photo-card:hover {
      border-color: var(--primary);
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.4);
      transform: translateX(10px);
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .photo-number {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--primary);
      color: white;
      padding: 0.5rem 1.2rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 1px;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--dark);
    }

    .empty-state p {
      font-size: 1.2rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px;
      color: var(--primary);
    }

    .error {
      background: rgba(255, 107, 53, 0.1);
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 1rem;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .loading {
      text-align: center;
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 1rem;
      }

      .header .logo {
        text-align: center;
      }

      .user-info {
        flex-direction: column;
        gap: 0.5rem;
      }

      .logo {
        font-size: 3.5rem;
      }

      .login-box {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div id="app"></div>

  <script>
    const SUPABASE_URL = 'https://djhrxrhucwfygnjvkqyl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqaHJ4cmh1Y3dmeWduanZrcXlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzOTAzMTYsImV4cCI6MjA4OTk2NjMxNn0.APKFBCb4PfuPoiD4c4p5AdUWe6aXpZZ3eFvifPuzvpw';

    let currentUser = null;
    let accessToken = null;
    let stream = null;

    // Check for existing session
    function checkSession() {
      const token = localStorage.getItem('supabase_access_token');
      const user = localStorage.getItem('supabase_user');
      if (token && user) {
        accessToken = token;
        currentUser = JSON.parse(user);
        renderApp();
      } else {
        renderLogin();
      }
    }

    // Auth API calls
    async function signIn(email, password) {
      const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();
      if (data.access_token) {
        accessToken = data.access_token;
        currentUser = data.user;
        localStorage.setItem('supabase_access_token', accessToken);
        localStorage.setItem('supabase_user', JSON.stringify(currentUser));
        return { success: true };
      } else {
        return { success: false, error: data.msg || 'Greška pri prijavljivanju' };
      }
    }

    async function signUp(email, password) {
      const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();
      if (data.id) {
        return { success: true };
      } else {
        return { success: false, error: data.msg || 'Greška pri registraciji' };
      }
    }

    function signOut() {
      localStorage.removeItem('supabase_access_token');
      localStorage.removeItem('supabase_user');
      currentUser = null;
      accessToken = null;
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      renderLogin();
    }

    // Database API calls
    async function getPhotos() {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/photos?select=*&order=created_at.desc&limit=23`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`
        }
      });
      return await response.json();
    }

    async function uploadPhoto(blob) {
      const fileName = `${currentUser.id}/${Date.now()}.jpg`;
      
      // Upload to storage
      const uploadResponse = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${fileName}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'image/jpeg'
        },
        body: blob
      });

      if (!uploadResponse.ok) {
        throw new Error('Upload failed');
      }

      // Insert metadata
      const dbResponse = await fetch(`${SUPABASE_URL}/rest/v1/photos`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          user_id: currentUser.id,
          storage_path: fileName
        })
      });

      if (!dbResponse.ok) {
        throw new Error('Database insert failed');
      }

      // Check and delete oldest if > 23
      const photos = await getPhotos();
      if (photos.length > 23) {
        const oldestPhoto = photos[photos.length - 1];
        
        // Delete from storage
        await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${oldestPhoto.storage_path}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${accessToken}`
          }
        });

        // Delete from database
        await fetch(`${SUPABASE_URL}/rest/v1/photos?id=eq.${oldestPhoto.id}`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${accessToken}`
          }
        });
      }
    }

    // Camera functions
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 1280, height: 720 } 
        });
        document.getElementById('video-preview').srcObject = stream;
        renderApp();
      } catch (error) {
        alert('Nije moguće pristupiti kameri: ' + error.message);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      renderApp();
    }

    async function capturePhoto() {
      const video = document.getElementById('video-preview');
      const canvas = document.getElementById('capture-canvas');
      const context = canvas.getContext('2d');
      
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0);
      
      canvas.toBlob(async (blob) => {
        try {
          document.getElementById('camera-section').innerHTML = '<div class="loading">ČUVAM...</div>';
          await uploadPhoto(blob);
          stopCamera();
          await loadAndRenderApp();
        } catch (error) {
          alert('Greška: ' + error.message);
          renderApp();
        }
      }, 'image/jpeg', 0.9);
    }

    // Render functions
    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-screen">
          <div class="container">
            <div class="login-box">
              <h1 class="logo">PKG23</h1>
              <div class="tagline">samo poslednjih 23</div>
              <form id="login-form">
                <div class="input-group">
                  <input type="email" id="email" class="input" placeholder="Email adresa" required>
                </div>
                <div class="input-group">
                  <input type="password" id="password" class="input" placeholder="Lozinka" required>
                </div>
                <button type="submit" class="btn">UĐI</button>
              </form>
              <div id="error-message"></div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');

        // Try sign in first
        let result = await signIn(email, password);
        
        if (!result.success) {
          // If sign in fails, try sign up
          result = await signUp(email, password);
          if (result.success) {
            errorDiv.innerHTML = '<div class="error">Nalog kreiran! Proveri email za potvrdu.</div>';
          } else {
            errorDiv.innerHTML = `<div class="error">${result.error}</div>`;
          }
        } else {
          await loadAndRenderApp();
        }
      });
    }

    async function loadAndRenderApp() {
      const photos = await getPhotos();
      renderApp(photos);
    }

    function renderApp(photos = []) {
      const cameraSection = stream ? `
        <div class="camera-view">
          <video id="video-preview" class="video-preview" autoplay playsinline></video>
          <canvas id="capture-canvas" style="display: none;"></canvas>
          <div class="camera-controls">
            <button class="btn-cancel" onclick="stopCamera()">OTKAŽI</button>
            <button class="btn-capture" onclick="capturePhoto()">📸 USLIKAJ</button>
          </div>
        </div>
      ` : `
        <button class="btn-camera" onclick="startCamera()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          SLIKAJ SE
        </button>
      `;

      const photosHtml = photos.length > 0 ? photos.map((photo, index) => `
        <div class="photo-card">
          <img src="${SUPABASE_URL}/storage/v1/object/public/photos/${photo.storage_path}" alt="Photo ${index + 1}" loading="lazy">
          <div class="photo-number">#${index + 1}</div>
        </div>
      `).join('') : `
        <div class="empty-state">
          <p>NEMA FOTOGRAFIJA</p>
          <p>Klikni na "SLIKAJ SE" da dodaš prvu!</p>
        </div>
      `;

      document.getElementById('app').innerHTML = `
        <div class="container">
          <header class="header">
            <h1 class="logo">PKG23</h1>
            <div class="user-info">
              <span class="user-email">${currentUser.email}</span>
              <button class="btn-logout" onclick="signOut()">IZAĐI</button>
            </div>
          </header>

          <div class="camera-section" id="camera-section">
            ${cameraSection}
          </div>

          <div class="gallery">
            <div class="gallery-header">
              <h2>POSLEDNJIH 23</h2>
              <div class="photo-count">${photos.length}/23</div>
            </div>
            <div class="photos-grid">
              ${photosHtml}
            </div>
          </div>
        </div>
      `;

      if (stream) {
        setTimeout(() => {
          document.getElementById('video-preview').srcObject = stream;
        }, 100);
      }
    }

    // Initialize
    checkSession();

    // Auto-refresh photos every 10 seconds
    setInterval(async () => {
      if (currentUser && !stream) {
        const photos = await getPhotos();
        renderApp(photos);
      }
    }, 10000);
  </script>
</body>
</html>
